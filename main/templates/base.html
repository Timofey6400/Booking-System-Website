{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Booking System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- JavaScript -->
    <script src="{% static 'js/main.js' %}" defer></script>
       <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
        <!-- CSS -->
    <link rel="stylesheet" href="{% static 'main/static/static.css' %}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <header>
    </header>

    <main class="flex-fill">
        {% block content %}
        {% endblock %}
    </main>

    <!-- ФУТЕР -->
    <footer class="bg-dark text-white text-center py-2 mt-auto">
        <p class="mb-0">
            &copy; 2026 Booking System. All rights reserved.<br>
            Developed by Tim Ryabokon.<br>

            <a href="https://t.me/rylfi" class="text-white text-decoration-none">
                <i class="fa-brands fa-telegram"></i> Developer's Telegram
            </a><br>

            <a href="https://github.com/Timofey6400" class="text-white text-decoration-none">
                <i class="fa-brands fa-github"></i> Developer's GitHub
            </a>
        </p>
    </footer>

</body>
</html>
