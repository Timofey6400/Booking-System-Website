{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Booking System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <header>
        <nav>
            <a href="/">Main</a> | 
            <a href="/about">About Us</a>
        </nav>
    </header>

    <main>
            <!-- JavaScript -->
        <script src="{% static 'js/main.js' %}" defer></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
            <!-- CSS -->
        <link rel="stylesheet" href="{% static 'static/static.css' %}">
    </main>

         Developed by Tim Ryabokon.<br>
         <a href="https://t.me/rylfi" class="text-white text-decoration-none">
            <i class="fa-brands fa-telegram"></i> Developer's Telegram
        </a>
        <br><a href="https://github.com/Timofey6400" class="text-white text-decoration-none">
            <i class="fa-brands fa-github"></i> Developer's GitHub

</html>
